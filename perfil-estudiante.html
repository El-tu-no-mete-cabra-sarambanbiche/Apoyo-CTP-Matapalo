<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil | Voz Escolar</title><style>:root{--green:#1672ad;--dark:#102a43;--gold:#edbd51;--paper:#f5f8fb;--muted:#647482;--line:#d5e2ea}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#eaf5fb,transparent 38%),var(--paper);color:#172b3d;font:16px Arial,sans-serif}.wrap{max-width:850px;width:calc(100% - 32px);margin:auto}.top{background:var(--dark);color:#fff;padding:18px 0}.top .wrap{display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.card{background:#fff;margin:55px auto;padding:clamp(24px,5vw,42px);border:1px solid var(--line);box-shadow:0 20px 50px #102a4318}.profile{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:24px}.avatar{width:70px;height:70px;border-radius:50%;background:var(--gold);color:var(--dark);display:grid;place-items:center;font-size:23px;font-weight:bold}.profile h1{color:var(--dark);font:700 38px Georgia,serif;margin:8px 0}.eyebrow{color:var(--green);font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.muted{color:var(--muted);line-height:1.6}.data{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}.item{border:1px solid var(--line);padding:18px}.item b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;margin-bottom:7px}.item span{font-size:17px}.btn{display:inline-block;margin-top:25px;background:var(--green);color:#fff;text-decoration:none;padding:13px 17px;border-radius:4px;font-weight:bold}@media(max-width:560px){.profile{align-items:flex-start;flex-direction:column}.data{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div class="wrap"><a href="index.html">← Portal escolar</a><a href="login.html">Cerrar sesión</a></div></header><main class="wrap"><section class="card"><div id="content"></div></section></main><script>const data=JSON.parse(sessionStorage.getItem('studentRegistration')||'null');const content=document.getElementById('content');if(!data){content.innerHTML='<p class="muted">No se encontró un registro de estudiante en esta sesión.</p><a class="btn" href="login.html">Ir al acceso</a>'}else{const initials=data.name.split(' ').map(word=>word[0]).slice(0,2).join('').toUpperCase();content.innerHTML='<div class="profile"><div class="avatar">'+initials+'</div><div><div class="eyebrow">Perfil estudiante</div><h1>'+data.name+'</h1><div class="muted">Tu cuenta está activa en Voz Escolar.</div></div></div><div class="data"><div class="item"><b>Correo</b><span>'+data.email+'</span></div><div class="item"><b>Sección</b><span>'+data.section+'</span></div><div class="item"><b>Nivel</b><span>'+data.grade+'</span></div><div class="item"><b>Estado</b><span>Registro activo</span></div></div><p class="muted">Desde el portal puedes consultar recursos y enviar reportes para que la institución dé seguimiento a tus necesidades.</p><a class="btn" href="reportes.html">Ir a reportes</a>'}</script></body></html>
