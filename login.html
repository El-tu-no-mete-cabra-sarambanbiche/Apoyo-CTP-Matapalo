<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | Voz Escolar</title><style>:root{--ink:#17251f;--green:#175b49;--dark:#10382e;--gold:#edbd51;--paper:#f5f7f2;--muted:#64736b;--line:#d8e3dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 10%,#e4f1e9 0 20%,transparent 40%),var(--paper);color:var(--ink);font:16px Arial,sans-serif}.wrap{max-width:560px;width:calc(100% - 32px);margin:auto}.top{background:var(--dark);color:#fff;padding:18px 0}.top a{color:#fff;text-decoration:none}.card{background:#fff;margin:48px auto;padding:clamp(24px,5vw,42px);border:1px solid var(--line);box-shadow:0 20px 50px #10382e18}.eyebrow{color:var(--green);font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.card h1{color:var(--dark);font:700 clamp(32px,6vw,48px) Georgia,serif;margin:12px 0}.card p{color:var(--muted);line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:26px 0 20px}.tab{border:1px solid var(--line);background:var(--paper);padding:12px;font-weight:bold;color:var(--muted);cursor:pointer}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}label{display:grid;gap:7px;color:var(--muted);font-weight:bold;font-size:13px;margin:16px 0}input,select{border:1px solid var(--line);padding:13px;border-radius:4px;font:inherit;background:#fff}.btn{width:100%;border:0;border-radius:4px;background:var(--green);color:#fff;padding:14px;font-weight:bold;cursor:pointer;font-size:15px}.message{display:none;padding:12px;background:#e4f1e9;color:var(--dark);margin-top:15px;font-size:13px}.message.error{background:#fde9d9;color:#93451f}.hidden{display:none}</style></head>
<body><header class="top"><div class="wrap"><a href="index.html">← Volver al portal</a></div></header><main class="wrap"><section class="card"><div class="eyebrow">Voz Escolar · Colegio Valle Central</div><h1 id="title">Iniciar sesión</h1><p id="intro">Accede a tu espacio institucional con el correo y la contraseña registrados.</p><div class="tabs"><button class="tab active" id="login-tab" type="button">Iniciar sesión</button><button class="tab" id="register-tab" type="button">Crear cuenta</button></div><form id="login-form"><label>Tipo de usuario<select id="login-role"><option value="student">Estudiante</option><option value="teacher">Docente</option></select></label><label>Correo institucional<input id="login-email" type="email" placeholder="nombre@vallecentral.edu" required></label><label>Contraseña<input id="login-password" type="password" placeholder="Tu contraseña" required></label><button class="btn" type="submit">Entrar</button></form><form id="register-form" class="hidden"><label>Tipo de usuario<select id="register-role"><option value="student">Estudiante</option><option value="teacher">Docente</option></select></label><label>Nombre completo<input id="name" required placeholder="Tu nombre y apellido"></label><label>Correo institucional<input id="email" type="email" required placeholder="nombre@vallecentral.edu"></label><label>Contraseña<input id="password" type="password" minlength="4" required placeholder="Mínimo 4 caracteres"></label><div id="student-fields"><label>Sección<input id="section" required placeholder="Ej. 8-2"></label><label>Nivel<input id="grade" required placeholder="Ej. Octavo año"></label></div><div id="teacher-fields" class="hidden"><label>Materia<input id="subject" placeholder="Ej. Ciencias"></label><label>Teléfono<input id="phone" type="tel" placeholder="8888-8888"></label></div><button class="btn" type="submit">Guardar mis datos</button></form><div class="message" id="message"></div></section></main><script>const byId=id=>document.getElementById(id);const message=byId('message');const loginForm=byId('login-form');const registerForm=byId('register-form');const setMode=mode=>{const registering=mode==='register';byId('title').textContent=registering?'Crear cuenta':'Iniciar sesión';byId('intro').textContent=registering?'Registra tus datos para participar en Voz Escolar.':'Accede a tu espacio institucional con el correo y la contraseña registrados.';loginForm.classList.toggle('hidden',registering);registerForm.classList.toggle('hidden',!registering);byId('login-tab').classList.toggle('active',!registering);byId('register-tab').classList.toggle('active',registering);message.style.display='none'};byId('login-tab').onclick=()=>setMode('login');byId('register-tab').onclick=()=>setMode('register');byId('register-role').onchange=event=>{const student=event.target.value==='student';byId('student-fields').classList.toggle('hidden',!student);byId('teacher-fields').classList.toggle('hidden',student);byId('section').required=student;byId('grade').required=student};registerForm.onsubmit=event=>{event.preventDefault();const role=byId('register-role').value;const data={role,name:byId('name').value,email:byId('email').value,password:byId('password').value,section:byId('section').value,grade:byId('grade').value,subject:byId('subject').value,phone:byId('phone').value};sessionStorage.setItem(role==='student'?'studentRegistration':'teacherRegistration',JSON.stringify(data));sessionStorage.setItem('activeRole',role);message.textContent='Datos guardados. Ya puedes iniciar sesión.';message.style.display='block';setMode('login');byId('login-role').value=role;byId('login-email').value=data.email};loginForm.onsubmit=event=>{event.preventDefault();const role=byId('login-role').value;const registration=JSON.parse(sessionStorage.getItem(role==='student'?'studentRegistration':'teacherRegistration')||'null');if(!registration){message.textContent='Primero crea tu cuenta en “Crear cuenta”.';message.className='message error';message.style.display='block';return}if(byId('login-email').value!==registration.email||byId('login-password').value!==registration.password){message.textContent='El correo o la contraseña no coinciden.';message.className='message error';message.style.display='block';return}sessionStorage.setItem('activeRole',role);window.location.href=role==='student'?'perfil-estudiante.html':'perfil.html'};</script></body></html>
